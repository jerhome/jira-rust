[package]
name = "jira-fake"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Faux serveur Jira Cloud en mémoire (127.0.0.1 uniquement) pour les tests d'intégration de jira-rust"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
fastrand = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }

[dev-dependencies]
jira-client = { path = "../jira-client" }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }

[[bin]]
name = "jira-fake"
path = "src/main.rs"
