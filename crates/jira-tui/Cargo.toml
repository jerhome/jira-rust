[package]
name = "jira-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
directories = "6.0.0"
jiff = "0.2.38"
jira-client = { version = "0.1.0", path = "../jira-client", features = ["mock"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[bin]]
name = "jira-rust"
path = "src/main.rs"

[dev-dependencies]
async-trait = "0.1.92"
jira-fake = { path = "../jira-fake" }
